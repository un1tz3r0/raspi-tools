[project]
name = "raspi-tools"
version = "0.1.0"
description = "piimg: customize and repair Raspberry Pi OS images and SD cards offline"
readme = "README.md"
requires-python = ">=3.11"  # tomllib
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6",
    "rich>=13",
    "ruamel-yaml>=0.18",
    "textual>=0.80",  # piimg tui
]
# NOT listed here: `guestfs` (libguestfs Python bindings). It is not on PyPI
# and cannot be built from git without the whole libguestfs autotools/OCaml
# build. Install it with apt (python3-guestfs); piimg.guest._import_guestfs()
# finds it in the distro's package directory at run time.

[project.urls]
Repository = "https://github.com/un1tz3r0/raspi-tools"

[project.scripts]
piimg = "piimg.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package sits in the repo root, not in src/.
module-root = ""
module-name = "piimg"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
# python3-guestfs is a compiled extension for the *distro* Python, so the venv
# must be built on the system interpreter, not a uv-managed download.
python-preference = "only-system"
